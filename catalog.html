<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог мебели — кухни, диваны, спальни, шкафы | Мир мебели</title>
  <meta name="description" content="Каталог мебели «Мир мебели» в Верхних Кигах: фильтры по цене, размерам, цвету и материалу. Доставка ежедневно, сборка, гарантия 18 месяцев.">
  <meta name="theme-color" content="#F7F3EC">
  <link rel="canonical" href="https://mir-mebeli.example/catalog.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div id="site-header" style="min-height:var(--header-h)"></div>

  <main id="main">
    <div class="container">
      <header class="page-head">
        <nav aria-label="Хлебные крошки"><ol class="crumbs" style="list-style:none;padding:0;margin:0 0 var(--sp-4)"><li><a href="index.html">Главная</a></li><li data-crumb>Каталог</li></ol></nav>
        <div class="page-head__row">
          <h1 class="page-title" data-title>Каталог мебели</h1>
          <p class="muted" data-subtitle style="max-width:460px">Доставка ежедневно · Сборка мастером · Оплата при получении</p>
        </div>
        <nav class="catnav" aria-label="Разделы" data-catnav></nav>
      </header>

      <div class="catalog">
        <aside class="filters" id="filters" aria-label="Фильтры">
          <div class="filters__head"><b style="font-size:1.15rem">Фильтры</b><button class="icon-btn" data-close-filters aria-label="Закрыть фильтры"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
          <form data-filters onsubmit="return false">
            <fieldset class="fgroup" style="border-left:0;border-right:0;border-top:0;margin:0">
              <legend class="fgroup__title" style="padding:0">Тип мебели</legend>
              <div data-f-cats></div>
            </fieldset>
            <div class="fgroup">
              <div class="fgroup__title">Цена, ₽</div>
              <div class="range">
                <label class="sr-only" for="pmin">Цена от</label><input class="input" id="pmin" name="pmin" inputmode="numeric" placeholder="от">
                <label class="sr-only" for="pmax">Цена до</label><input class="input" id="pmax" name="pmax" inputmode="numeric" placeholder="до">
              </div>
              <div class="range-slider" aria-hidden="true">
                <span class="range-slider__track"></span><span class="range-slider__fill" data-fill></span>
                <input type="range" data-rmin tabindex="-1"><input type="range" data-rmax tabindex="-1">
              </div>
            </div>
            <div class="fgroup">
              <div class="fgroup__title">Ширина, см</div>
              <div class="range">
                <label class="sr-only" for="wmin">Ширина от</label><input class="input" id="wmin" name="wmin" inputmode="numeric" placeholder="от">
                <label class="sr-only" for="wmax">Ширина до</label><input class="input" id="wmax" name="wmax" inputmode="numeric" placeholder="до">
              </div>
            </div>
            <div class="fgroup">
              <div class="fgroup__title">Цвет</div>
              <div class="swatches" data-f-colors></div>
            </div>
            <fieldset class="fgroup" style="border-left:0;border-right:0;border-top:0;margin:0">
              <legend class="fgroup__title" style="padding:0">Материал</legend>
              <div data-f-mats></div>
            </fieldset>
            <div class="fgroup">
              <label class="check"><input type="checkbox" name="stock"><span>Только в наличии</span></label>
              <label class="check" style="margin-top:var(--sp-3)"><input type="checkbox" name="sale"><span>Со скидкой</span></label>
            </div>
            <div class="filters__apply" style="display:grid;gap:var(--sp-2);padding-top:var(--sp-5)">
              <button type="button" class="btn btn--dark btn--block filter-open" data-close-filters data-apply>Показать</button>
              <button type="button" class="btn btn--ghost btn--sm" data-reset>Сбросить фильтры</button>
            </div>
          </form>
        </aside>

        <section aria-label="Товары">
          <div class="toolbar">
            <span class="toolbar__count" data-count-text aria-live="polite"></span>
            <div class="toolbar__right">
              <button class="btn btn--ghost btn--sm filter-open" data-open-filters><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Фильтры</button>
              <label class="sr-only" for="sort">Сортировка</label>
              <select class="select" id="sort" data-sort>
                <option value="pop">Сначала популярные</option>
                <option value="asc">Сначала дешевле</option>
                <option value="desc">Сначала дороже</option>
                <option value="sale">Сначала со скидкой</option>
              </select>
            </div>
          </div>
          <div class="chips" data-chips></div>
          <div class="grid-products" data-grid></div>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/catalog.js" defer></script>
</body>
</html>
